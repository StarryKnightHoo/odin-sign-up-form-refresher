<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="logo-section">
        <img class="background" src="./images/bart-zimny-W5XTTLpk1-I-unsplash.jpg" alt="leaves">
        <div class="logo-background">
            <img class="logo" src="./images/odin-lined.png" alt="The Odin Project logo">
            <div>ODIN</div>
        </div>
        <div class="credits">Photo by <a href="https://unsplash.com/@bartzimny" target="_blank">Bart Zimny</a> on <a href="https://unsplash.com/photos/shallow-photography-of-leaves-W5XTTLpk1-I" target="_blank">Unsplash</a></div>
    </div>
    
    <div class="form-section">
        <div>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <span class="emphasize">now</span> to get started.<br><br>You <span class="emphasize">know</span> you want to.</div>
        <form>
            <div class="form">
                <div class="header">Let's do this!</div>
                <div class="questions">
                    <div class="first-name">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" name="first-name" placeholder="Thor">
                    </div>
                    <div class="last-name">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="last-name" placeholder="Odinson">
                    </div>
                    <div class="email">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="thor.odinson@gmail.com">
                    </div>
                    <div class="phone-number">
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone" name="phone" placeholder="123-123-1234">
                    </div>
                    <div class="password">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="password-confirm">
                        <label for="password-confirm">PASSWORD</label>
                        <input type="password" id="password-confirm" name="password-confirm">
                    </div>
                </div>
            </div>
            <div class="create account">
                <button class="submit">Create Account</button>
                <div>Already have an account? <button class="log-in">Log in</button></div>
            </div>
        </form>
    </div>
</body>
</html>
